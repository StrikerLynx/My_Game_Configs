// Alias
alias "!dc" "disconnect"
alias "!q" "quit"
alias "!c" "clear"
alias "ngg" "connect 46.105.73.18:27015"
alias "unz" "connect 51.195.188.106:27015"

// Audio
volume "0.120"
snd_musicvolume "0.45"
voice_enable "1"
voice_scale "1"
voice_overdrive "2"
voice_maxgain "10"
snd_headphone_pan_exponent "2"

// Mouse
m_rawinput "1"
m_pitch "0.022"
m_filter "0"
m_customaccel "0"
m_mouseaccel1 "0"
m_mouseaccel2 "0"
sensitivity "1.50"

// Network
rate "786432"
cl_interp "0"
cl_interp_ratio "1"
cl_lagcompensation "1"
cl_cmdrate "100"
cl_updaterate "100"
cl_predictweapons "1"
cl_allowdownload "1"
cl_allowupload "1"
cl_downloadfilter "all"

// HUD
net_graph "1"
net_graphheight "100"
net_graphmsecs "400"
net_graphpos "2"
net_graphproportionalfont "0"
net_graphshowinterp "1"
net_graphshowlatency "1"
net_graphsolid "1"
net_graphtext "1"
net_scale "5"
hud_fastswitch "1"
cl_showpos "1"

// Crosshair & Radar
cl_radar_locked "1"
cl_dynamiccrosshair "0"
cl_crosshairalpha "255.000000"
cl_crosshairsize "2.420000"
cl_crosshairthickness "0.570000"
cl_crosshaircolor_r "50.000000"
cl_crosshaircolor_g "250.000000"
cl_crosshaircolor_b "50.000000"

// Performance & Graphics
fps_max "500"
mat_vsync "0"
mat_colorcorrection "0"

