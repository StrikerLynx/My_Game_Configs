// ZE Binds
bind "i" "sm_deagle"
bind "o" "sm_usp"
bind "p" "sm_m4"
bind "k" "slot1; wait 6; drop;sm_mp5; wait 6;slot1"
bind "n" "say !smoke"
bind "j" "slot1; wait 6; drop;sm_sg552; wait 6;slot1"

bind "v" "sm_kevlar"
bind "f1" "slot1; wait 6; drop;sm_tmp; wait 6;slot1"
bind "f2" "slot1; wait 6; drop;sm_ak; wait 6;slot1"
bind "f3" "slot1; wait 6; drop;sm_m249; wait 6;slot1"
