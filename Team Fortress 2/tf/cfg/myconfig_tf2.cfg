//---------------------------------
// Config for tf2 stuff.
// Double slash for comments.
//---------------------------------

// FOV
fov_desired "90"
viewmodel_fov "90"
tf_use_min_viewmodels "1"
r_drawviewmodel "1"

// Binds
bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"
bind "j" "r_drawviewmodel 1"
bind "k" "kill"
bind "alt" "+attack3"

// Alias
alias "!dc" "disconnect"
alias "!q" "quit"
alias "!c" "clear"

// Sens & Audio
m_rawinput "1"
sensitivity "1.25"
volume "0.075"

// Network
rate "786432"
cl_interp "0"
cl_interp_ratio "1"
cl_lagcompensation "1"
cl_cmdrate "128"
cl_updaterate "128"
cl_predictweapons "1"

// Performance
fps_max "500"
mat_vsync "0"

// HUD
net_graph "1"
net_graphheight "100"
net_graphmsecs "400"
net_graphpos "2"
net_graphproportionalfont "0"
net_graphshowinterp "1"
net_graphshowlatency "1"
net_graphsolid "1"
net_graphtext "1"
net_scale "5"
hud_fastswitch "1"
cl_showpos "1"